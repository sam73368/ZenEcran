name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEN_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Préparer la clé de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret KEYSTORE_PASSWORD absent : APK signé avec une clé temporaire (les mises à jour ne s'installeront pas par-dessus)."
            exit 0
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/zen.jks.enc -out "$RUNNER_TEMP/zen.jks" -pass env:KEYSTORE_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/zen.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZenEcran.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ZenEcran-apk
          path: ZenEcran.apk

      - name: Mettre à jour le tag "latest"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Préparer les notes de version
        run: |
          {
            echo "build=${{ github.run_number }}"
            git log -1 --pretty=%s
          } > notes.txt

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Zen Écran 1.${{ github.run_number }} (build ${{ github.run_number }})"
          body_path: notes.txt
          files: ZenEcran.apk
