name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZenEcran.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ZenEcran-apk
          path: ZenEcran.apk

      - name: Mettre à jour le tag "latest"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Zen Écran - dernier build"
          body: "APK compilé automatiquement. Télécharge ZenEcran.apk puis installe-le sur ton téléphone."
          files: ZenEcran.apk
